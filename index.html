<body class="min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // 구글 앱스 스크립트(GAS) Web App URL
        const gasWebhookUrl = 'https://script.google.com/macros/s/AKfycbzxREUCSyZdEkZGDsWTxUhRY-o1f5uKXznDEgVljYgWPTS21UqIPcfdvtMxYIP22myS/exec';

        // 시간을 24시간 형식(HH:mm)으로 일관되게 정규화하는 헬퍼 함수
        const normalizeTime = (timeStr) => {
            if (!timeStr) return "00:00";
            let str = String(timeStr).trim();
            if (str.includes(':')) {
                const parts = str.split(':');
                const h = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                const validH = isNaN(h) ? 0 : ((h % 24) + 24) % 24;
                const validM = isNaN(m) ? 0 : ((m % 60) + 60) % 60;
                return `${String(validH).padStart(2, '0')}:${String(validM).padStart(2, '0')}`;
            }
            const num = parseFloat(str);
            if (!isNaN(num)) {
                const hours = Math.floor(num) % 24;
                const minutes = (num % 1) >= 0.5 ? 30 : 0;
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }
            return "00:00";
        };

        const translations = {

            },
            en: {

            },

            ja: {

                notice: "各同盟のR4、R5にご申請ください。重複を防ぐため、事前に十分更新してください。",
                statusBtn: "📋 申請状況を見る",
                modalReserveTitle: "官職予約申請",
                modalStatusTitle: "予約申請一覧",
                alliance: "同盟",
                name: "名前",
                category: "分類",
                time: "時間選択",
                submit: "申請する",
                cancel: "キャンセル",
                cancelBtn: "キャンセル",
                passwordPrompt: "キャンセルパスワードを入力してください：",
                passwordError: "パスワードが正しくありません。",
                processing: "処理中",
                completed: "完了",
                customAlliance: "カスタム同盟名",
                selectCategory: "分類を選択",
                selectTime: "時間を選択",
                requiredField: "すべての項目を入力してください。",
                allCategory: "すべて",
                construction: "建設",

                directReserveText: "予約する"

        };

        function App() {
            const [lang, setLang] = useState('ko');
            const [timeZoneMode, setTimeZoneMode] = useState('local');
            const [selectedDay, setSelectedDay] = useState(0);
            const [daysData, setDaysData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);

            const [isReserveModalOpen, setIsReserveModalOpen] = useState(false);
            const [isStatusModalOpen, setIsStatusModalOpen] = useState(false);

            const [statusCategoryFilter, setStatusCategoryFilter] = useState('전체');

            const [formAlliance, setFormAlliance] = useState('TNT');
            const [formCustomAlliance, setFormCustomAlliance] = useState('');
            const [formName, setFormName] = useState('');
            const [formCategory, setFormCategory] = useState('건설');
            const [formTime, setFormTime] = useState('');

            // 로컬 스토리지 데이터로 초기화
            const [requests, setRequests] = useState(() => {
                try {
                    const saved = localStorage.getItem('wos_requests_v3');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) {
                    return [];
                }
            });

            const t = translations[lang];

            // 데이터 유효성 검증 및 정제 함수
            const sanitizeRequests = (dataArray) => {
                if (!Array.isArray(dataArray)) return [];
                return dataArray.filter(item => 
                    item && 
                    typeof item === 'object' && 
                    item.id && 
                    String(item.id).trim() !== '' &&
                    item.name && 
                    String(item.name).trim() !== ''
                );
            };

            const fetchRequestsFromBackend = useCallback(async () => {
                try {
                    const res = await fetch(`${gasWebhookUrl}?action=get`);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data)) {
                            const cleanData = sanitizeRequests(data);
                            setRequests(cleanData);
                            localStorage.setItem('wos_requests_v3', JSON.stringify(cleanData));
                        }
                    }
                } catch (err) {
                    console.log("GAS fetch sync (using local fallback):", err);
                }
            }, []);

            useEffect(() => {
                fetchRequestsFromBackend();
            }, [fetchRequestsFromBackend]);

            // 구글 시트 데이터가 로드되면 실제 시트 칸과 대조하여 자동 처리상태(처리완료/처리중) 동기화
            useEffect(() => {
                if (daysData.length > 0) {
                    setRequests(prevRequests => {
                        const sanitized = sanitizeRequests(prevRequests);
                        const updated = sanitized.map(req => {
                            let isFilledInSheet = false;
                            const reqNormTime = normalizeTime(req.time);
                            for (const day of daysData) {
                                if (day.title === req.dateTitle) {
                                    const foundSlot = day.slots.find(s => normalizeTime(s.utcTime) === reqNormTime);
                                    if (foundSlot && foundSlot.name && foundSlot.name.trim() !== "") {
                                        isFilledInSheet = true;
                                        break;
                                    }
                                }
                            }
                            return {
                                ...req,
                                status: isFilledInSheet ? '처리완료' : '처리중'
                            };
                        });
                        localStorage.setItem('wos_requests_v3', JSON.stringify(updated));
                        return updated;
                    });
                }
            }, [daysData]);

            const formatSlotTime = (val) => normalizeTime(val);

            const loadSampleData = () => {
                setDaysData([
                    {
                        title: "DAY 5 건설",
                        slots: [
                            { utcTime: "00:00", name: "[BOV]TeleYoshi 요시_X" },
                            { utcTime: "00:30", name: "[BOV]nabijan" },
                            { utcTime: "01:00", name: "[BOV]NG Slon 슬론" },
                            { utcTime: "01:30", name: "" },
                            { utcTime: "02:00", name: "" },
                            { utcTime: "02:30", name: "[GOM]베베곰Bebe" },
                            { utcTime: "03:00", name: "[GOM]수왕대군아빠곰" },
                            { utcTime: "03:30", name: "[GOM]곰왕베베" },
                            { utcTime: "04:00", name: "[GOM]Daniel 다니엘" },
                            { utcTime: "06:00", name: "[BOV]토토 toto" }
                        ]
                    },
                    {
                        title: "DAY 2 연구",
                        slots: [
                            { utcTime: "00:00", name: "[BOV]TeleYoshi 요시_X" },
                            { utcTime: "00:30", name: "[BOV]nabijan" },
                            { utcTime: "01:00", name: "[GOM]alpha centauri" }
                        ]
                    },
                    {
                        title: "DAY 4 훈련",
                        slots: [
                            { utcTime: "00:00", name: "[TNT]전투대원1" },
                            { utcTime: "01:00", name: "[BOW]훈련병" }
                        ]
                    }
                ]);
            };

            const parseCSV = (text) => {
                const lines = text.split('\n').map(line => line.split(',').map(cell => cell.replace(/^"|"$/g, '').trim()));
                let extractedDays = [];
                let currentSlots = [];
                let dayIndex = 0;

                const dayNamesMapping = ["DAY 5 건설", "DAY 2 연구", "DAY 4 훈련"];

                for (let i = 0; i < lines.length; i++) {
                    const row = lines[i];
                    const rowStr = row.join(' ');

                    if (rowStr.includes('DAY') && rowStr.includes('public')) {
                        if (currentSlots.length > 0) {
                            extractedDays.push({ title: dayNamesMapping[dayIndex] || "DAY Schedule", slots: currentSlots });
                            dayIndex++;
                            currentSlots = [];
                        }
                    }

                    if (row.length >= 4 && !isNaN(row[0]) && row[0] !== "") {
                        if (row[0] !== undefined && row[1] !== undefined) {
                            currentSlots.push({ utcTime: formatSlotTime(row[0]), name: row[1] || "" });
                        }
                        if (row[2] !== undefined && row[3] !== undefined) {
                            currentSlots.push({ utcTime: formatSlotTime(row[2]), name: row[3] || "" });
                        }
                    }
                }

                if (currentSlots.length > 0) {
                    extractedDays.push({ title: dayNamesMapping[dayIndex] || "DAY Schedule", slots: currentSlots });
                }

                if (extractedDays.length === 0) {
                    loadSampleData();
                } else {
                    setDaysData(extractedDays);
                }
            };

            useEffect(() => {
                async function fetchSheetData() {
                    try {
                        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1FQ9nuNwRSr0wz7x5ha_FKU2WkZuUrhDmi7haiGkQrP4/export?format=csv&gid=0';
                        const response = await fetch(sheetUrl);
                        if (!response.ok) throw new Error('Network response was not ok');
                        const csvText = await response.text();
                        parseCSV(csvText);
                    } catch (err) {
                        console.error("Sheet load error:", err);
                        loadSampleData();
                        setError(true);
                    } finally {
                        setLoading(false);
                    }
                }
                fetchSheetData();
            }, []);

            const convertTime = (utcTimeString) => {
                const normTime = normalizeTime(utcTimeString);
                if (timeZoneMode === 'utc') return normTime;
                try {
                    const [hourStr, minStr] = normTime.split(':');
                    const utcH = parseInt(hourStr, 10);
                    const utcM = parseInt(minStr || '0', 10);
                    
                    const now = new Date();
                    const utcDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), utcH, utcM, 0));
                    
                    const localH = String(utcDate.getHours()).padStart(2, '0');
                    const localM = String(utcDate.getMinutes()).padStart(2, '0');
                    return `${localH}:${localM}`;
                } catch (e) {
                    return normTime;
                }
            };

            const handleSlotReserveClick = (slot) => {
                const currentDayTitle = daysData[selectedDay]?.title || 'DAY 5 건설';
                let defaultCategory = "건설";
                if (currentDayTitle.includes("연구")) defaultCategory = "연구";
                if (currentDayTitle.includes("훈련")) defaultCategory = "훈련";

                setFormCategory(defaultCategory);
                setFormTime(normalizeTime(slot.utcTime));
                setFormName('');
                setFormCustomAlliance('');
                setIsReserveModalOpen(true);
            };

            const handleFormSubmit = async (e) => {
                e.preventDefault();
                const allianceName = formAlliance === '직접입력' ? formCustomAlliance : formAlliance;
                if (!formName || !formTime || !allianceName) {
                    alert(t.requiredField);
                    return;
                }

                const newReq = {
                    id: String(Date.now()),
                    alliance: allianceName,
                    name: formName,
                    category: formCategory,
                    time: formTime,
                    status: '처리중',
                    dateTitle: daysData[selectedDay]?.title || 'DAY 5 건설'
                };

                const updated = [newReq, ...requests];
                setRequests(updated);
                localStorage.setItem('wos_requests_v3', JSON.stringify(updated));
                setIsReserveModalOpen(false);
                setFormName('');
                setFormCustomAlliance('');

                try {
                    await fetch(gasWebhookUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'add', ...newReq })
                    });
                } catch (err) {
                    console.error("GAS submit error:", err);
                }

                alert("예약 신청이 성공적으로 접수되었습니다.");
                setTimeout(fetchRequestsFromBackend, 2000);
            };

            const handleCancelRequest = async (reqId) => {
                const inputPw = prompt(t.passwordPrompt);
                if (inputPw === null) return;
                if (inputPw === '1953') {
                    const updatedRequests = sanitizeRequests(requests).filter(r => String(r.id) !== String(reqId));
                    setRequests(updatedRequests);
                    localStorage.setItem('wos_requests_v3', JSON.stringify(updatedRequests));

                    try {
                        await fetch(gasWebhookUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'delete', id: String(reqId) })
                        });
                        alert("예약 신청이 삭제 처리되었습니다.");
                    } catch (err) {
                        console.error("GAS delete sync error:", err);
                    }

                    setTimeout(fetchRequestsFromBackend, 2500);
                } else {
                    alert(t.passwordError);
                }
            };

            // 유효한 데이터만 산출하여 표시
            const validRequests = sanitizeRequests(requests);

            const filteredRequests = validRequests.filter(req => {
                if (statusCategoryFilter === '전체') return true;
                return req.category === statusCategoryFilter;
            });

            const sortedRequests = [...filteredRequests].sort((a, b) => {
                if (a.status === '처리중' && b.status !== '처리중') return -1;
                if (a.status !== '처리중' && b.status === '처리중') return 1;
                return Number(b.id) - Number(a.id);
            });

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    {/* 헤더 영역 */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 gap-4">
                        <div className="flex items-center space-x-3">
                            <span className="text-3xl">🏛️</span>
                            <div>
                                <h1 className="text-xl font-bold text-slate-900">{t.title}</h1>
                                <p className="text-xs text-slate-500">{t.subtitle}</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            <div className="flex space-x-1 bg-slate-100 p-1 rounded-xl">
                                {['ko', 'en', 'zh', 'ja'].map((l) => (
                                    <button
                                        key={l}
                                        onClick={() => setLang(l)}
                                        className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${
                                            lang === l ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'
                                        }`}
                                    >
                                        {l === 'ko' ? '한국어' : l === 'en' ? 'Eng' : l === 'zh' ? '中文' : '日本語'}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* 안내 바 */}
                    <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl mb-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="text-xs text-amber-800 leading-relaxed">
                            <p className="font-semibold mb-1">📢 Notice / 안내사항</p>
                            {t.notice}
                        </div>
                        <div className="flex space-x-2 shrink-0">
                            <button
                                onClick={() => setIsStatusModalOpen(true)}
                                className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold shadow-md transition-all flex items-center space-x-1"
                            >
                                <span>{t.statusBtn}</span>
                                <span className="bg-amber-500 text-white rounded-full px-1.5 py-0.2 text-[10px] ml-1">
                                    {requests.filter(r => r.status === '처리중').length}
                                </span>
                            </button>
                        </div>
                    </div>

                    {/* 탭 및 시각 전환 바 */}
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                        <div className="flex flex-wrap gap-2">
                            {daysData.map((day, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setSelectedDay(idx)}
                                    className={`px-4 py-2 rounded-xl text-sm font-bold transition-all shadow-sm ${
                                        selectedDay === idx
                                            ? 'bg-slate-900 text-white'
                                            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                                    }`}
                                >
                                    {day.title}
                                </button>
                            ))}
                        </div>

                        <div className="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                            <button
                                onClick={() => setTimeZoneMode('utc')}
                                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-all ${
                                    timeZoneMode === 'utc' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:text-slate-900'
                                }`}
                            >
                                🌐 {t.utc}
                            </button>
                            <button
                                onClick={() => setTimeZoneMode('local')}
                                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-all ${
                                    timeZoneMode === 'local' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:text-slate-900'
                                }`}
                            >
                                ⏰ {t.local}
                            </button>
                        </div>
                    </div>

                    {/* 그리드 현황판 */}
                    {loading ? (
                        <div className="text-center py-20 text-slate-500 font-medium animate-pulse">
                            {t.loading}
                        </div>
                    ) : daysData.length > 0 ? (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                            {daysData[selectedDay]?.slots.map((slot, index) => {
                                const isOccupied = slot.name && slot.name.trim() !== "";
                                return (
                                    <div
                                        key={index}
                                        className={`p-4 rounded-2xl border transition-all flex flex-col justify-between shadow-sm ${
                                            isOccupied
                                                ? 'bg-white border-slate-200'
                                                : 'bg-slate-50/50 border-slate-300'
                                        }`}
                                    >
                                        <div className="text-center pb-2 border-b border-slate-100 mb-2 flex justify-between items-center">
                                            <span className="text-xs font-bold text-slate-400">#{index + 1}</span>
                                            <span className="text-sm font-bold text-slate-700 tracking-tight">
                                                {convertTime(slot.utcTime)}
                                            </span>
                                            <span className="w-4"></span>
                                        </div>
                                        <div className="text-center py-3 min-h-[50px] flex flex-col items-center justify-center">
                                            {isOccupied ? (
                                                <span className="text-xs font-semibold text-slate-800 break-words leading-snug">
                                                    {slot.name}
                                                </span>
                                            ) : (
                                                <div className="flex flex-col items-center space-y-2 w-full">
                                                    <span className="text-xs text-slate-400 italic">
                                                        {t.empty}
                                                    </span>
                                                    <button
                                                        onClick={() => handleSlotReserveClick(slot)}
                                                        className="w-full py-1.5 px-3 bg-white hover:bg-slate-100 border border-dashed border-slate-300 rounded-lg text-xs font-bold text-slate-600 shadow-sm transition-all flex items-center justify-center space-x-1"
                                                    >
                                                        <span>{t.directReserveText}</span>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="text-center py-20 text-red-500 font-medium">
                            {t.error}
                        </div>
                    )}

                    {/* 예약 신청 모달 */}
                    {isReserveModalOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-200">
                                <h3 className="text-lg font-bold text-slate-900 mb-4 flex items-center space-x-2">
                                    <span>📅</span>
                                    <span>{t.modalReserveTitle}</span>
                                </h3>
                                <form onSubmit={handleFormSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.alliance}</label>
                                        <select
                                            value={formAlliance}
                                            onChange={(e) => setFormAlliance(e.target.value)}
                                            className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white"
                                        >
                                            <option value="TNT">TNT</option>
                                            <option value="BOW">BOW</option>
                                            <option value="GOM">GOM</option>
                                            <option value="WOW">WOW</option>
                                            <option value="GOP">GOP</option>
                                            <option value="직접입력">직접 입력</option>
                                        </select>
                                    </div>
                                    {formAlliance === '직접입력' && (
                                        <div>
                                            <input
                                                type="text"
                                                placeholder={t.customAlliance}
                                                value={formCustomAlliance}
                                                onChange={(e) => setFormCustomAlliance(e.target.value)}
                                                className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            />
                                        </div>
                                    )}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.name}</label>
                                        <input
                                            type="text"
                                            placeholder="닉네임 입력"
                                            value={formName}
                                            onChange={(e) => setFormName(e.target.value)}
                                            className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.category}</label>
                                        <input
                                            type="text"
                                            value={formCategory}
                                            disabled
                                            className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-100 text-slate-600 text-sm font-semibold cursor-not-allowed"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.time}</label>
                                        <input
                                            type="text"
                                            value={`${convertTime(formTime)} (${timeZoneMode === 'utc' ? 'UTC' : t.local})`}
                                            disabled
                                            className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-100 text-slate-600 text-sm font-semibold cursor-not-allowed"
                                        />
                                    </div>
                                    <div className="flex space-x-2 pt-2">
                                        <button
                                            type="submit"
                                            className="flex-1 py-2.5 bg-amber-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-amber-700 transition-all"
                                        >
                                            {t.submit}
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setIsReserveModalOpen(false)}
                                            className="flex-1 py-2.5 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold hover:bg-slate-300 transition-all"
                                        >
                                            {t.cancel}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 신청 현황 모달 */}
                    {isStatusModalOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 border border-slate-200 max-h-[85vh] flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-900 flex items-center space-x-2">
                                        <span>📋</span>
                                        <span>{t.modalStatusTitle}</span>
                                    </h3>
                                </div>

                                <div className="flex space-x-1 bg-slate-100 p-1 rounded-xl mb-4">
                                    {['전체', '건설', '연구', '훈련'].map((cat) => {
                                        let label = cat;
                                        if (cat === '전체') label = t.allCategory;
                                        if (cat === '건설') label = t.construction;
                                        if (cat === '연구') label = t.research;
                                        if (cat === '훈련') label = t.training;

                                        return (
                                            <button
                                                key={cat}
                                                onClick={() => setStatusCategoryFilter(cat)}
                                                className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                                                    statusCategoryFilter === cat
                                                        ? 'bg-amber-600 text-white shadow-sm'
                                                        : 'text-slate-600 hover:bg-slate-200'
                                                }`}
                                            >
                                                {label}
                                            </button>
                                        );
                                    })}
                                </div>

                                <div className="overflow-y-auto flex-1 space-y-3 pr-1">
                                    {sortedRequests.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 text-sm">
                                            접수된 신청 내역이 없습니다.
                                        </div>
                                    ) : (
                                        sortedRequests.map((req) => {
                                            const isProcessing = req.status === '처리중';
                                            return (
                                                <div
                                                    key={req.id}
                                                    className={`p-4 rounded-xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition-all ${
                                                        isProcessing
                                                            ? 'bg-amber-50/70 border-amber-300 shadow-md ring-1 ring-amber-400'
                                                            : 'bg-slate-50 border-slate-200 opacity-75'
                                                    }`}
                                                >
                                                    <div className="space-y-1">
                                                        <div className="flex items-center space-x-2">
                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                                isProcessing ? 'bg-amber-600 text-white' : 'bg-slate-600 text-white'
                                                            }`}>
                                                                [{req.alliance}]
                                                            </span>
                                                            <span className="text-sm font-bold text-slate-900">{req.name}</span>
                                                            <span className="text-xs text-slate-500 font-medium">({req.category})</span>
                                                        </div>
                                                        <div className="text-xs text-slate-600 flex items-center space-x-2">
                                                            <span>📅 {req.dateTitle}</span>
                                                            <span>⏰ {convertTime(req.time)} ({timeZoneMode === 'utc' ? 'UTC' : t.local})</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-2 self-end sm:self-center">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                                                            isProcessing
                                                                ? 'bg-amber-500 text-white animate-pulse'
                                                                : 'bg-emerald-600 text-white'
                                                        }`}>
                                                            {req.status}
                                                        </span>
                                                        <button
                                                            onClick={() => handleCancelRequest(req.id)}
                                                            className="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm"
                                                        >
                                                            {t.cancelBtn}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                                <div className="mt-4 pt-3 border-t border-slate-100 text-right">
                                    <button
                                        onClick={() => setIsStatusModalOpen(false)}
                                        className="px-5 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition-all"
                                    >
                                        닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
